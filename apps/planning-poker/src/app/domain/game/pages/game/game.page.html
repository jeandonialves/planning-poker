<nz-empty nzNotFoundImage="https://gw.alipayobjects.com/zos/antfincdn/ZHrcdLPrvN/empty.svg" [nzNotFoundContent]="contentTpl" [nzNotFoundFooter]="footerTpl">
  <ng-template #contentTpl>
    <span> Você ainda não criou uma sala de jogo. </span>
  </ng-template>
  <ng-template #footerTpl>
    <button nz-button nzType="primary" (click)="onClick()">Criar uma sala</button>
  </ng-template>
</nz-empty>
