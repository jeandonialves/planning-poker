<form nz-form (ngSubmit)="login()" [formGroup]="loginForm">
  <nz-form-item>
    <nz-form-label [nzSpan]="6" nzFor="email">E-mail</nz-form-label>
    <nz-form-control [nzSpan]="14">
      <input nz-input type="email" formControlName="email" />
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-label [nzSpan]="6" nzFor="password">Password</nz-form-label>
    <nz-form-control [nzSpan]="14">
      <input nz-input type="password" formControlName="password" />
    </nz-form-control>
  </nz-form-item>

  <a routerLink="/auth/forgot-password">Esqueceu sua senha?</a>

  <button nz-button nzType="primary">Login</button>
</form>
