<form nz-form (ngSubmit)="submit()">
  <nz-form-item>
    <nz-form-label [nzSpan]="6" nzFor="email">E-mail</nz-form-label>
    <nz-form-control [nzSpan]="14">
      <input nz-input type="email" [(ngModel)]="email" name="email" />
    </nz-form-control>
  </nz-form-item>

  <button type="submit" nz-button nzType="primary" nzBlock [disabled]="!email()">Enviar e-mail</button>
  <button nz-button nzType="text" nzBlock routerLink="/auth">Voltar</button>
</form>
