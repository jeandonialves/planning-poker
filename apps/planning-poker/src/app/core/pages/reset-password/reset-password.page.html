<form nz-form (ngSubmit)="submit()">
  <nz-form-item>
    <nz-form-label [nzSpan]="6" nzFor="password">Senha</nz-form-label>
    <nz-form-control [nzSpan]="14">
      <input nz-input type="password" name="password" [(ngModel)]="password" />
    </nz-form-control>
  </nz-form-item>

  <button nz-button nzType="primary">Atualizar senha</button>
</form>
